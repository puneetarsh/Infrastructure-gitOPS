name: "GITOPS WORKFLOW"
on:
    push:
        branches:
         - main
         - stage
        paths:
         - "terraform/**"
    pull_request:
        branches:
         - main
        paths:
         - "terraform/**"

env:
#credentials for deploying to AWS
 AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
 AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
 #S3 bucket for storing terrafrom state files
 BUCKET_TF_STATE: ${{ secrets.BUCKET_TF_STATE }}
 AWS_REGION: us-east-2
 EKS_CLUSTER_NAME: "eks-cluster"
   
jobs:
    terraform:
        name: "Apply terrafrom code changes"
        runs-on: ubuntu-latest
        default:
            run:
              shell: bash
              #use a bash shell and working dir should be ./terrafrom
              #so this will throughout all steps
              working-directory: ./terraform
            steps:
                -name: "Checkout code"
                 uses: actions/checkout@v5
                

                 #we dont need to say install terrafrom 
                 #there is an action,this will setup terraform for us
                -name: "Setup terraform"
                    uses: hashicorp/setup-terraform@v4
                    with:
                    terraform_version: 1.6.3
               
                    #giving id to each step is not mandatory
                -name: "Terraform init"
                 id: init
                 run: terraform init -backend-config="bucket=$BUCKET_TF_STATE" 

                -name: "Terraform format"
                 id: fmt
                 run: terraform fmt -check

                -name: "Terraform validate"
                 id: validate
                 run: terraform validate

                -name: "Terraform plan"
                 id: plan
                 #there is nobody to pass any kind of input
                 #so we will disable the input and also we will save the plan in a file called planfile
                 #we store all the information in a file because we will use this file in the next step to apply the changes
                 run: terraform plan -no-color -input=false -out planfile
                 continue-on-error: true

                -name: "Terraform apply"
                if: steps.plan.outcome == 'failure'
                run: exit 1
                 
